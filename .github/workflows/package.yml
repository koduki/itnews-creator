name: Build skill packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify skill and manifests
        run: |
          python tests/test_package.py
          python -m unittest discover -s tests -p 'test_build_packages.py' -v
          python -m unittest discover -s tests -p 'test_qa_pptx.py' -v
      - name: Build two distribution ZIPs
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          python scripts/build_packages.py --out-dir dist --tag "$tag"
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: itnews-creator-packages-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: itnews-creator-packages-${{ github.run_id }}
          path: dist
      - name: Publish tagged ZIPs to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi