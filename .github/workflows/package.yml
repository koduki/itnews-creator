name: Build Gemini and PowerPoint skills

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for Apps Script relay tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GAS syntax and relay behavior
        run: |
          node --check skills/weekly-it-news-gemini/scripts/screenshot_relay.js
          node --test tests/test_gas_relay.cjs
      - name: Install PPTX generator test dependencies
        run: python -m pip install "python-pptx>=1.0,<2" "Pillow>=10,<13"
      - name: Run active pipeline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build two skill ZIPs
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          python scripts/build_packages.py --out-dir dist --tag "$tag"
          (cd dist && sha256sum *.zip > SHA256SUMS)
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: itnews-creator-skills-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built skills
        uses: actions/download-artifact@v4
        with:
          name: itnews-creator-skills-${{ github.run_id }}
          path: dist
      - name: Publish tagged ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
